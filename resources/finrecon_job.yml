
resources:
  jobs:
    finrecon_environment_check:
      name: finrecon-environment-check
      tasks:
        - task_key: environment_check
          notebook_task:
            notebook_path: ../notebooks/01_environment_check.py
          environment_key: default
      environments:
        - environment_key: default
          spec:
            environment_version: "4"

    finrecon_job:
      name: finrecon-job
      tasks:
        - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/02_bronze_ingestion.py
          environment_key: default

        - task_key: silver_transformations
          depends_on:
            - task_key: bronze_ingestion
          notebook_task:
            notebook_path: ../notebooks/03_silver_transformations.py
          environment_key: default

      environments:
        - environment_key: default
          spec:
            environment_version: "4"
